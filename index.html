<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#171030">
  <title>梗图大乱斗</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#171030; }
    #game { width:100%; height:100%; border:0; display:block; }
    #enhanceBtn {
      position:fixed; z-index:10; right:14px; bottom:18px;
      border:1px solid #ffe27a; border-radius:999px; padding:11px 16px;
      color:#5b3310; background:linear-gradient(160deg,#fff06a,#ff9a3d);
      box-shadow:0 5px 18px #0008; font:700 15px "Microsoft YaHei","PingFang SC",sans-serif;
      cursor:pointer; touch-action:manipulation;
    }
    #enhanceBtn:active { transform:scale(.95); }
    #notice {
      position:fixed; z-index:11; left:50%; bottom:72px; transform:translateX(-50%);
      display:none; max-width:calc(100vw - 32px); padding:9px 14px; border-radius:10px;
      color:#fff; background:#16102ddd; border:1px solid #ffd94a;
      font:14px "Microsoft YaHei","PingFang SC",sans-serif; text-align:center;
    }
  </style>
</head>
<body>
  <iframe id="game" src="梗图大乱斗.html" title="梗图大乱斗"></iframe>
  <button id="enhanceBtn" type="button">⚡ 一键增强</button>
  <div id="notice" role="status"></div>
  <script>
    const iframe = document.getElementById("game");
    const button = document.getElementById("enhanceBtn");
    const notice = document.getElementById("notice");
    const cardIds = ["daxiao", "tiaomei", "paoxiao", "jiaoshi", "yeshi", "ning", "zhongzhi", "bian"];

    function showNotice(text) {
      notice.textContent = text;
      notice.style.display = "block";
      clearTimeout(showNotice.timer);
      showNotice.timer = setTimeout(() => notice.style.display = "none", 2200);
    }

    button.addEventListener("click", () => {
      try {
        const storage = iframe.contentWindow.localStorage;
        let state;
        try { state = JSON.parse(storage.getItem("meme_rpg") || "null"); } catch (_) { state = null; }
        if (!state) state = { coins: 9999999, stage: 1, own: {}, team: [] };
        state.coins = 9999999;
        state.own = state.own || {};
        cardIds.forEach(id => { state.own[id] = { n: 5 }; });
        state.team = cardIds.slice(0, 3);
        storage.setItem("meme_rpg", JSON.stringify(state));
        iframe.contentWindow.location.reload();
        showNotice("增强完成：全卡解锁、五星满级、金币 9999999！");
      } catch (error) {
        showNotice("增强失败，请刷新页面后重试。");
      }
    });
  </script>
</body>
</html>
